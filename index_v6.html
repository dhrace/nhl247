<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NHL247 FlightMap V6</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
html,body{height:100%;margin:0;font-family:Segoe UI,Arial,sans-serif;background:#08111f;color:#fff}
#sidebar{position:absolute;left:0;top:0;bottom:0;width:420px;background:#0f172a;overflow:auto;z-index:1000}
#map{position:absolute;left:420px;right:0;top:0;bottom:0}
.hdr{padding:14px 16px;background:#111827;border-bottom:1px solid #334155}
.hdr h2{margin:0 0 4px;font-size:1.25rem}
.hdr .sub{font-size:12px;color:#94a3b8}
.game{background:#1e293b;margin:8px;padding:12px;border-radius:10px;cursor:pointer;transition:background .15s;border-left:4px solid #475569}
.game:hover{background:#334155}
.game.live-border{border-left-color:#22c55e}
.game.fut-border{border-left-color:#3b82f6}
.game.final-border{border-left-color:#94a3b8}
.score{font-size:26px;font-weight:bold;margin:6px 0 4px}
.teams-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.teams-row img.logo{width:28px;height:28px;object-fit:contain;background:rgba(255,255,255,.08);border-radius:4px;padding:2px}
.vs{font-size:12px;color:#64748b;font-weight:600}
.meta{font-size:12px;color:#94a3b8;line-height:1.45}
.meta strong{color:#e2e8f0}
#status{position:absolute;top:10px;right:10px;background:#fff;color:#000;padding:8px 12px;border-radius:8px;z-index:2000;font-size:13px;box-shadow:0 2px 8px rgba(0,0,0,.3)}
input[type=text],input[type=date]{margin:6px 10px;width:calc(100% - 20px);padding:9px 10px;border-radius:6px;border:1px solid #334155;background:#1e293b;color:#fff;box-sizing:border-box}
.filters{display:flex;flex-wrap:wrap;gap:6px;padding:4px 10px 6px}
.chip{padding:5px 10px;border-radius:16px;border:1px solid #475569;background:#1e293b;color:#cbd5e1;font-size:12px;cursor:pointer;user-select:none}
.chip.active{background:#2563eb;border-color:#2563eb;color:#fff}
.chip.live.active{background:#16a34a;border-color:#16a34a}
.chip.fut.active{background:#2563eb;border-color:#2563eb}
.chip.final.active{background:#64748b;border-color:#64748b}
.live{color:#4ade80}
.future{color:#60a5fa}
.final{color:#d1d5db}
.btn-row{display:flex;gap:8px;padding:4px 10px 8px}
.btn{flex:1;padding:8px 10px;background:#2563eb;color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:13px}
.btn:hover{background:#1d4ed8}
.btn.secondary{background:#334155}
.btn.secondary:hover{background:#475569}
.date-nav{display:flex;align-items:center;gap:6px;padding:4px 10px 2px}
.date-nav .btn{flex:0 0 auto;width:40px;padding:8px 0}
.date-nav input{margin:0;flex:1}
.note{font-size:11px;color:#64748b;padding:0 12px 10px;line-height:1.4}
.game-label{
  color:#fff;font-weight:700;font-size:12px;line-height:1.2;
  padding:4px 7px;border-radius:8px;text-align:center;
  white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,.45);
  pointer-events:none;border:2px solid transparent;
}
.label-live{background:rgba(22,163,74,.92);border-color:#4ade80}
.label-fut{background:rgba(37,99,235,.9);border-color:#60a5fa}
.label-final{background:rgba(30,41,59,.92);border-color:#94a3b8}
.game-label .teams{font-size:11px;opacity:.95}
.game-label .sc{font-size:14px;margin-top:1px}
.game-label .tm{font-size:10px;font-weight:600;margin-top:2px;opacity:.9}
@media(max-width:900px){
  #sidebar{width:100%;height:45%}
  #map{left:0;top:45%}
}
</style>
</head>
<body>
<div id="sidebar">
  <div class="hdr">
    <h2>🏒 NHL247 FlightMap V6</h2>
    <div class="sub">Hybride · labels live · historique</div>
  </div>

  <div class="date-nav">
    <button class="btn secondary" id="prevDay" title="Jour précédent">◀</button>
    <input type="date" id="datePick">
    <button class="btn secondary" id="nextDay" title="Jour suivant">▶</button>
    <button class="btn secondary" id="todayBtn" title="Aujourd'hui" style="width:auto;padding:8px 10px">Auj.</button>
  </div>

  <input type="text" id="filter" placeholder="Filtrer équipe (MTL, TOR, Canadiens...)">

  <div class="filters" id="statusFilters">
    <span class="chip active" data-status="ALL">Tous</span>
    <span class="chip live" data-status="LIVE">Live</span>
    <span class="chip fut" data-status="FUT">À venir</span>
    <span class="chip final" data-status="FINAL">Terminés</span>
  </div>

  <div class="btn-row">
    <button class="btn" id="reloadBtn">🔄 Actualiser</button>
    <button class="btn secondary" id="forceLocalBtn">📁 Forcer local</button>
  </div>
  <div class="note">
    Labels visibles en permanence sur la carte. Chrono mis à jour pour les matchs LIVE.
    Choisis une date pour consulter le passé / futur.
  </div>

  <div id="games">Chargement...</div>
</div>

<div id="status">Init...</div>
<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const arenas = {
  MTL:[45.496,-73.5693], TOR:[43.6435,-79.3791], OTT:[45.2969,-75.9272],
  EDM:[53.5461,-113.497], CGY:[51.0374,-114.05], VAN:[49.2775,-123.108],
  WPG:[49.8926,-97.1439], SEA:[47.622,-122.354], LAK:[34.043,-118.2673],
  ANA:[33.8078,-117.8767], VGK:[36.1028,-115.178], COL:[39.7487,-105.0077],
  DAL:[32.7905,-96.8103], CHI:[41.8807,-87.6742], MIN:[44.9448,-93.101],
  STL:[38.6268,-90.2026], NSH:[36.1591,-86.7785], DET:[42.3411,-83.055],
  CBJ:[39.969,-83.0063], PIT:[40.439,-79.9894], BUF:[42.875,-78.8766],
  BOS:[42.3662,-71.0621], NYR:[40.7505,-73.9934], NYI:[40.7229,-73.5905],
  NJD:[40.7336,-74.171], PHI:[39.9012,-75.1719], WSH:[38.8981,-77.0209],
  CAR:[35.8033,-78.7218], TBL:[27.9427,-82.4518], FLA:[26.1585,-80.3256],
  SJS:[37.3328,-121.9011]
};

const map = L.map('map').setView([45, -97], 4);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '© OpenStreetMap'
}).addTo(map);

let games = [];
let markers = [];
let activeStatus = 'ALL';
let selectedDate = null; // YYYY-MM-DD or null = "now"
let tickTimer = null;

function todayISO() {
  return new Date().toISOString().slice(0, 10);
}

function shiftDate(iso, days) {
  const d = new Date(iso + 'T12:00:00');
  d.setDate(d.getDate() + days);
  return d.toISOString().slice(0, 10);
}

function proxyUrlsFor(dateIso) {
  const path = dateIso ? `scoreboard/${dateIso}` : 'scoreboard/now';
  const target = `https://api-web.nhle.com/v1/${path}`;
  return [
    `https://corsproxy.io/?${target}`,
    `https://cors.isomorphic-git.org/${target}`,
    target
  ];
}

function periodText(g) {
  const pd = g.periodDescriptor;
  if (!pd) return '';
  if (pd.periodType === 'OT') return pd.number > 4 ? `Prol. ${pd.number - 3}` : 'Prolongation';
  if (pd.periodType === 'SO') return 'Tirs de barrage';
  return `${pd.number}e période`;
}

function clockText(g) {
  if (g.gameState === 'LIVE') {
    const clock = g.clock?.timeRemaining;
    const per = periodText(g);
    if (clock) return `${per} · ${clock}`;
    return per || 'LIVE';
  }
  if (g.gameState === 'FUT') {
    return new Date(g.startTimeUTC).toLocaleTimeString('fr-CA', {
      hour: '2-digit', minute: '2-digit'
    });
  }
  if (g.gameState === 'FINAL' || g.gameState === 'OFF') {
    const per = periodText(g);
    if (per && per !== '3e période') return `FINAL (${per})`;
    return 'FINAL';
  }
  return g.gameState || '';
}

function statusClass(state) {
  if (state === 'LIVE') return 'live';
  if (state === 'FUT') return 'future';
  return 'final';
}

function borderClass(state) {
  if (state === 'LIVE') return 'live-border';
  if (state === 'FUT') return 'fut-border';
  return 'final-border';
}

function labelClass(state) {
  if (state === 'LIVE') return 'label-live';
  if (state === 'FUT') return 'label-fut';
  return 'label-final';
}

function formatDateFR(iso) {
  if (!iso) return '';
  try {
    return new Date(iso + 'T12:00:00').toLocaleDateString('fr-CA', {
      weekday: 'short', year: 'numeric', month: 'short', day: 'numeric'
    });
  } catch {
    return iso;
  }
}

function formatStartLocal(g) {
  return new Date(g.startTimeUTC).toLocaleString('fr-CA', {
    weekday: 'short', day: 'numeric', month: 'short',
    hour: '2-digit', minute: '2-digit'
  });
}

function matchesStatus(g) {
  if (activeStatus === 'ALL') return true;
  if (activeStatus === 'LIVE') return g.gameState === 'LIVE';
  if (activeStatus === 'FUT') return g.gameState === 'FUT';
  if (activeStatus === 'FINAL') return g.gameState === 'FINAL' || g.gameState === 'OFF';
  return true;
}

function filteredGames() {
  const q = (document.getElementById('filter').value || '').toUpperCase().trim();
  return games.filter(g => {
    if (!matchesStatus(g)) return false;
    if (!q) return true;
    const hay = [
      g.awayTeam.abbrev, g.homeTeam.abbrev,
      g.awayTeam.placeName?.default, g.homeTeam.placeName?.default,
      g.awayTeam.commonName?.default, g.homeTeam.commonName?.default
    ].filter(Boolean).join(' ').toUpperCase();
    return hay.includes(q);
  });
}

function labelHtml(g) {
  const away = g.awayTeam.abbrev;
  const home = g.homeTeam.abbrev;
  const sa = g.awayTeam.score ?? 0;
  const sh = g.homeTeam.score ?? 0;
  const tm = clockText(g);
  return `
    <div class="game-label ${labelClass(g.gameState)}">
      <div class="teams">${away} @ ${home}</div>
      <div class="sc">${sa} – ${sh}</div>
      <div class="tm">${tm}</div>
    </div>`;
}

function clearMarkers() {
  markers.forEach(m => map.removeLayer(m));
  markers = [];
}

function placeMarkers(list) {
  clearMarkers();
  const byArena = {};
  list.forEach(g => {
    const h = g.homeTeam.abbrev;
    if (!arenas[h]) return;
    if (!byArena[h]) byArena[h] = [];
    byArena[h].push(g);
  });

  Object.entries(byArena).forEach(([abbrev, gs]) => {
    const base = arenas[abbrev];
    gs.forEach((g, i) => {
      const lat = base[0] + (i * 0.12);
      const lng = base[1] + (i * 0.08);
      const icon = L.divIcon({
        className: '',
        html: labelHtml(g),
        iconSize: null,
        iconAnchor: [50, 20]
      });
      const m = L.marker([lat, lng], { icon, zIndexOffset: g.gameState === 'LIVE' ? 1000 : 0 }).addTo(map);
      m._gameId = g.id;
      m.bindPopup(`
        <b>${g.awayTeam.abbrev} @ ${g.homeTeam.abbrev}</b><br>
        <div style="font-size:22px;font-weight:bold">${g.awayTeam.score ?? 0} – ${g.homeTeam.score ?? 0}</div>
        <div>${clockText(g)}</div>
        <div style="font-size:12px;margin-top:4px">${formatStartLocal(g)}</div>
        <div style="font-size:11px;color:#555">${g.venue?.default || ''}</div>
      `);
      markers.push(m);
    });
  });
}

function updateLiveLabels() {
  markers.forEach(m => {
    const g = games.find(x => x.id === m._gameId);
    if (!g || g.gameState !== 'LIVE') return;
    const icon = L.divIcon({
      className: '',
      html: labelHtml(g),
      iconSize: null,
      iconAnchor: [50, 20]
    });
    m.setIcon(icon);
  });
  // also refresh sidebar times for live
  draw();
}

function draw() {
  const list = filteredGames();
  const el = document.getElementById('games');

  if (!list.length) {
    el.innerHTML = `<div class="game"><b>Aucun match</b><div class="meta">Ajuste la date ou les filtres</div></div>`;
    return;
  }

  const order = { LIVE: 0, FUT: 1, FINAL: 2, OFF: 2 };
  list.sort((a, b) => {
    const oa = order[a.gameState] ?? 3;
    const ob = order[b.gameState] ?? 3;
    if (oa !== ob) return oa - ob;
    return new Date(a.startTimeUTC) - new Date(b.startTimeUTC);
  });

  el.innerHTML = list.map(g => {
    const cls = statusClass(g.gameState);
    const border = borderClass(g.gameState);
    const dateStr = formatDateFR(g.gameDate);
    const startStr = formatStartLocal(g);
    const awayLogo = g.awayTeam.logo || `https://assets.nhle.com/logos/nhl/svg/${g.awayTeam.abbrev}_light.svg`;
    const homeLogo = g.homeTeam.logo || `https://assets.nhle.com/logos/nhl/svg/${g.homeTeam.abbrev}_light.svg`;
    return `
      <div class="game ${border}" data-id="${g.id}">
        <div class="teams-row ${cls}">
          <img class="logo" src="${awayLogo}" alt="${g.awayTeam.abbrev}" loading="lazy"
               onerror="this.style.display='none'">
          <b>${g.awayTeam.abbrev}</b>
          <span class="vs">@</span>
          <img class="logo" src="${homeLogo}" alt="${g.homeTeam.abbrev}" loading="lazy"
               onerror="this.style.display='none'">
          <b>${g.homeTeam.abbrev}</b>
        </div>
        <div class="score">${g.awayTeam.score ?? 0} – ${g.homeTeam.score ?? 0}</div>
        <div class="meta">
          <strong>${clockText(g)}</strong><br>
          📅 ${dateStr}<br>
          🕐 ${startStr}<br>
          📍 ${g.venue?.default || '—'}
        </div>
      </div>`;
  }).join('');

  el.querySelectorAll('.game').forEach(card => {
    card.addEventListener('click', () => {
      const g = games.find(x => String(x.id) === card.dataset.id);
      if (!g) return;
      const coords = arenas[g.homeTeam.abbrev];
      if (coords) {
        map.setView(coords, 8);
        const m = markers.find(mk => mk._gameId === g.id);
        if (m) m.openPopup();
      }
    });
  });
}

function applyData(data, source) {
  games = [];
  (data.gamesByDate || []).forEach(d => {
    (d.games || []).forEach(g => {
      if (selectedDate && g.gameDate && g.gameDate !== selectedDate) return;
      games.push(g);
    });
  });

  if (selectedDate && games.length === 0) {
    (data.gamesByDate || []).forEach(d => {
      if (d.date === selectedDate) (d.games || []).forEach(g => games.push(g));
    });
  }

  placeMarkers(filteredGames());
  draw();
  document.getElementById('status').innerText =
    `OK · ${source} · ${games.length} matchs` + (selectedDate ? ` · ${selectedDate}` : '');

  if (tickTimer) clearInterval(tickTimer);
  if (games.some(g => g.gameState === 'LIVE')) {
    tickTimer = setInterval(() => {
      // soft refresh of live data every 15s without full UI flicker if possible
      load(false);
    }, 20000);
  }
}

async function fetchLive(dateIso) {
  const urls = proxyUrlsFor(dateIso);
  for (const url of urls) {
    try {
      const ctrl = new AbortController();
      const t = setTimeout(() => ctrl.abort(), 7000);
      const r = await fetch(url, { signal: ctrl.signal, cache: 'no-store' });
      clearTimeout(t);
      if (!r.ok) continue;
      const data = await r.json();
      if (data && data.gamesByDate) return data;
    } catch (_) {}
  }
  return null;
}

async function fetchLocal() {
  const r = await fetch('scoreboard_now.json', { cache: 'no-store' });
  if (!r.ok) throw new Error(`JSON local introuvable (HTTP ${r.status})`);
  return r.json();
}

async function load(forceLocal = false) {
  const statusEl = document.getElementById('status');
  const dateIso = selectedDate;
  statusEl.innerText = forceLocal ? 'Chargement local...' : (dateIso ? `Chargement ${dateIso}...` : 'Tentative live...');

  try {
    let data = null;
    let source = '';

    if (!forceLocal) {
      data = await fetchLive(dateIso);
      if (data) source = dateIso ? `API ${dateIso}` : 'API live';
    }

    if (!data) {
      statusEl.innerText = 'Live bloqué → JSON local...';
      data = await fetchLocal();
      source = 'JSON local';
    }

    applyData(data, source);
  } catch (e) {
    document.getElementById('games').innerHTML = `
      <div class="game">
        <b>Erreur</b><br>${e.message}<br><br>
        Place <code>scoreboard_now.json</code> à côté de cette page, ou réessaie plus tard.
      </div>`;
    statusEl.innerText = 'Erreur';
  }
}

document.getElementById('statusFilters').addEventListener('click', e => {
  const chip = e.target.closest('.chip');
  if (!chip) return;
  document.querySelectorAll('#statusFilters .chip').forEach(c => c.classList.remove('active'));
  chip.classList.add('active');
  activeStatus = chip.dataset.status;
  placeMarkers(filteredGames());
  draw();
});

document.getElementById('filter').addEventListener('input', () => {
  placeMarkers(filteredGames());
  draw();
});

document.getElementById('reloadBtn').addEventListener('click', () => load(false));
document.getElementById('forceLocalBtn').addEventListener('click', () => load(true));

document.getElementById('datePick').addEventListener('change', e => {
  const v = e.target.value;
  if (!v) return;
  selectedDate = v;
  load(false);
});

document.getElementById('prevDay').addEventListener('click', () => {
  const base = selectedDate || todayISO();
  selectedDate = shiftDate(base, -1);
  document.getElementById('datePick').value = selectedDate;
  load(false);
});

document.getElementById('nextDay').addEventListener('click', () => {
  const base = selectedDate || todayISO();
  selectedDate = shiftDate(base, 1);
  document.getElementById('datePick').value = selectedDate;
  load(false);
});

document.getElementById('todayBtn').addEventListener('click', () => {
  selectedDate = null;
  document.getElementById('datePick').value = todayISO();
  load(false);
});

document.getElementById('datePick').value = todayISO();
selectedDate = null;
load(false);
setInterval(() => load(false), 45000);
</script>
</body>
</html>
