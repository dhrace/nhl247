<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NHL247 FlightMap V6</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{
  --bg:#070d18;--panel:#0b1220;--card:#152033;--card-hover:#1c2a42;
  --border:#243247;--text:#f1f5f9;--muted:#94a3b8;--accent:#e31837;
  --live:#22c55e;--fut:#3b82f6;--final:#94a3b8;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;font-family:Segoe UI,system-ui,-apple-system,Arial,sans-serif;background:var(--bg);color:var(--text)}
body{display:flex;flex-direction:column}
.hdr{flex:0 0 auto;display:flex;align-items:center;gap:12px;padding:10px 14px;background:linear-gradient(180deg,#111827 0%,#0b1220 100%);border-bottom:1px solid var(--border);z-index:1100}
.hdr-logo{width:40px;height:40px;object-fit:contain;filter:drop-shadow(0 1px 2px rgba(0,0,0,.4))}
.hdr-text{flex:1;min-width:0}
.hdr-text h1{margin:0;font-size:1.05rem;font-weight:700;letter-spacing:.02em;display:flex;align-items:center;gap:6px}
.hdr-text h1 span.nhl{color:var(--accent)}
.hdr-text .sub{font-size:11px;color:var(--muted);margin-top:1px}
.live-dot{width:8px;height:8px;border-radius:50%;background:var(--live);box-shadow:0 0 0 0 rgba(34,197,94,.7);animation:pulse 1.6s infinite;display:inline-block}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(34,197,94,.55)}70%{box-shadow:0 0 0 8px rgba(34,197,94,0)}100%{box-shadow:0 0 0 0 rgba(34,197,94,0)}}
.main{flex:1;min-height:0;display:flex;position:relative}
#sidebar{width:400px;max-width:100%;background:var(--panel);overflow:auto;border-right:1px solid var(--border);display:flex;flex-direction:column}
#map{flex:1;min-width:0;min-height:0}
.controls{padding:8px 10px 6px;border-bottom:1px solid var(--border);background:#0a101c}
.date-label{font-size:13px;font-weight:600;color:#e2e8f0;padding:2px 2px 6px;letter-spacing:.01em}
.date-nav{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.date-nav input[type=date]{flex:1;padding:8px 10px;border-radius:8px;border:1px solid var(--border);background:#121a2b;color:var(--text);font-size:14px}
.icon-btn{width:38px;height:38px;border:1px solid var(--border);border-radius:8px;background:#121a2b;color:var(--text);font-size:14px;cursor:pointer}
.icon-btn:active{background:#1c2a42}
.today-btn{height:38px;padding:0 10px;border:1px solid var(--border);border-radius:8px;background:#121a2b;color:var(--text);font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap}
#filter{width:100%;padding:9px 12px;border-radius:8px;border:1px solid var(--border);background:#121a2b;color:var(--text);font-size:14px;margin-bottom:6px}
.filters{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:6px 11px;border-radius:999px;border:1px solid var(--border);background:#121a2b;color:#cbd5e1;font-size:12px;cursor:pointer;user-select:none}
.chip.active{background:#1d4ed8;border-color:#1d4ed8;color:#fff}
.chip.live.active{background:#15803d;border-color:#15803d}
.chip.final.active{background:#475569;border-color:#475569}
#games{flex:1;overflow:auto;padding:6px 0 16px;-webkit-overflow-scrolling:touch}
.game{background:var(--card);margin:6px 8px;padding:12px;border-radius:12px;cursor:pointer;transition:background .15s;border-left:4px solid #475569}
.game:active{background:var(--card-hover)}
.game.live-border{border-left-color:var(--live)}
.game.fut-border{border-left-color:var(--fut)}
.game.final-border{border-left-color:var(--final)}
.teams-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.teams-row img.logo{width:30px;height:30px;object-fit:contain;background:#fff;border-radius:6px;padding:2px}
.vs{font-size:12px;color:#64748b;font-weight:600}
.score{font-size:26px;font-weight:800;margin:8px 0 4px;letter-spacing:.02em}
.meta{font-size:12px;color:var(--muted);line-height:1.5}
.meta strong{color:#e2e8f0}
.live{color:var(--live)}.future{color:#60a5fa}.final{color:var(--final)}
.game-label{color:#fff;font-weight:700;font-size:11px;line-height:1.15;padding:5px 7px 4px;border-radius:10px;text-align:center;white-space:nowrap;box-shadow:0 3px 10px rgba(0,0,0,.55);pointer-events:none;border:2px solid transparent;min-width:96px}
.label-live{background:rgba(22,163,74,.95);border-color:#4ade80}
.label-fut{background:rgba(37,99,235,.93);border-color:#60a5fa}
.label-final{background:rgba(15,23,42,.95);border-color:#94a3b8}
.game-label .logos{display:flex;align-items:center;justify-content:center;gap:4px;margin-bottom:2px}
.game-label .logos img{width:22px;height:22px;object-fit:contain;background:#fff;border-radius:4px;padding:2px;box-shadow:0 0 0 1px rgba(0,0,0,.08)}
.game-label .logos .at{font-size:9px;opacity:.85;font-weight:600}
.game-label .sc{font-size:14px;font-weight:800;margin:1px 0}
.game-label .tm{font-size:10px;font-weight:600;opacity:.92}
.game-label .dt{font-size:9px;font-weight:600;opacity:.85;margin-top:1px}
.menu-toggle{display:none;border:1px solid var(--border);background:#121a2b;color:#fff;border-radius:8px;width:40px;height:40px;font-size:18px;cursor:pointer;flex-shrink:0}
.backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:1050}
.backdrop.show{display:block}
@media (max-width:900px){
  .menu-toggle{display:inline-flex;align-items:center;justify-content:center}
  .main{flex-direction:column}
  #sidebar{position:fixed;left:0;top:0;bottom:0;width:min(360px,88vw);z-index:1100;transform:translateX(-105%);transition:transform .22s ease;box-shadow:8px 0 24px rgba(0,0,0,.4);border-right:1px solid var(--border)}
  #sidebar.open{transform:translateX(0)}
  #map{width:100%;height:100%}
  .hdr{padding:10px 12px}
  .hdr-text h1{font-size:1rem}
}
</style>
</head>
<body>
<header class="hdr">
  <button class="menu-toggle" id="menuToggle" aria-label="Menu">☰</button>
  <img class="hdr-logo" src="https://assets.nhle.com/logos/nhl/svg/NHL_light.svg" alt="NHL"
       onerror="this.src='https://upload.wikimedia.org/wikipedia/en/3/3a/05_NHL_Shield.svg'">
  <div class="hdr-text">
    <h1><span class="nhl">NHL</span>247 FlightMap <span class="live-dot" title="Mise à jour auto"></span></h1>
    <div class="sub">Scores · carte · historique</div>
  </div>
</header>
<div class="backdrop" id="backdrop"></div>
<div class="main">
  <aside id="sidebar">
    <div class="controls">
      <div class="date-label" id="dateLabel">—</div>
      <div class="date-nav">
        <button class="icon-btn" id="prevDay" title="Jour précédent">◀</button>
        <input type="date" id="datePick">
        <button class="icon-btn" id="nextDay" title="Jour suivant">▶</button>
        <button class="today-btn" id="todayBtn">Auj.</button>
      </div>
      <input type="text" id="filter" placeholder="Filtrer équipe (MTL, TOR...)">
      <div class="filters" id="statusFilters">
        <span class="chip active" data-status="ALL">Tous</span>
        <span class="chip live" data-status="LIVE">Live</span>
        <span class="chip fut" data-status="FUT">À venir</span>
        <span class="chip final" data-status="FINAL">Terminés</span>
      </div>
    </div>
    <div id="games">Chargement...</div>
  </aside>
  <div id="map"></div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const arenas = {
  MTL:[45.496,-73.5693], TOR:[43.6435,-79.3791], OTT:[45.2969,-75.9272],
  EDM:[53.5461,-113.497], CGY:[51.0374,-114.05], VAN:[49.2775,-123.108],
  WPG:[49.8926,-97.1439], SEA:[47.622,-122.354], LAK:[34.043,-118.2673],
  ANA:[33.8078,-117.8767], VGK:[36.1028,-115.178], COL:[39.7487,-105.0077],
  DAL:[32.7905,-96.8103], CHI:[41.8807,-87.6742], MIN:[44.9448,-93.101],
  STL:[38.6268,-90.2026], NSH:[36.1591,-86.7785], DET:[42.3411,-83.055],
  CBJ:[39.969,-83.0063], PIT:[40.439,-79.9894], BUF:[42.875,-78.8766],
  BOS:[42.3662,-71.0621], NYR:[40.7505,-73.9934], NYI:[40.7229,-73.5905],
  NJD:[40.7336,-74.171], PHI:[39.9012,-75.1719], WSH:[38.8981,-77.0209],
  CAR:[35.8033,-78.7218], TBL:[27.9427,-82.4518], FLA:[26.1585,-80.3256],
  SJS:[37.3328,-121.9011], UTA:[40.7683,-111.9011]
};

const map = L.map('map', { zoomControl: true }).setView([45, -97], 4);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '© OpenStreetMap', maxZoom: 18
}).addTo(map);

let games = [];
let markers = [];
let activeStatus = 'ALL';
let selectedDate = null;

function todayISO() {
  return new Date().toISOString().slice(0, 10);
}
function shiftDate(iso, days) {
  const d = new Date(iso + 'T12:00:00');
  d.setDate(d.getDate() + days);
  return d.toISOString().slice(0, 10);
}
function proxyUrlsFor(path) {
  const target = `https://api-web.nhle.com/v1/${path}`;
  return [
    `https://corsproxy.io/?${target}`,
    `https://cors.isomorphic-git.org/${target}`,
    target
  ];
}
function periodText(g) {
  const pd = g.periodDescriptor;
  if (!pd) return '';
  if (pd.periodType === 'OT') return pd.number > 4 ? `Prol. ${pd.number - 3}` : 'Prolongation';
  if (pd.periodType === 'SO') return 'Tirs de barrage';
  return `${pd.number}e période`;
}
function clockText(g) {
  if (g.gameState === 'LIVE') {
    const clock = g.clock?.timeRemaining;
    const per = periodText(g);
    return clock ? `${per} · ${clock}` : (per || 'LIVE');
  }
  if (g.gameState === 'FUT') {
    return new Date(g.startTimeUTC).toLocaleTimeString('fr-CA', { hour: '2-digit', minute: '2-digit' });
  }
  if (g.gameState === 'FINAL' || g.gameState === 'OFF') {
    const per = periodText(g);
    return (per && per !== '3e période') ? `FINAL (${per})` : 'FINAL';
  }
  return g.gameState || '';
}
function statusClass(state) {
  if (state === 'LIVE') return 'live';
  if (state === 'FUT') return 'future';
  return 'final';
}
function borderClass(state) {
  if (state === 'LIVE') return 'live-border';
  if (state === 'FUT') return 'fut-border';
  return 'final-border';
}
function labelClass(state) {
  if (state === 'LIVE') return 'label-live';
  if (state === 'FUT') return 'label-fut';
  return 'label-final';
}
function formatDateOnly(iso) {
  // "17 octobre 2026" (jour du mois + mois + année, sans jour de semaine)
  if (!iso) return '';
  return new Date(iso + 'T12:00:00').toLocaleDateString('fr-CA', {
    day: 'numeric', month: 'long', year: 'numeric'
  });
}
function formatDateShort(iso) {
  if (!iso) return '';
  return new Date(iso + 'T12:00:00').toLocaleDateString('fr-CA', {
    day: 'numeric', month: 'short'
  });
}
function formatTimeOnly(g) {
  // "21 h 00"
  return new Date(g.startTimeUTC).toLocaleTimeString('fr-CA', {
    hour: '2-digit', minute: '2-digit'
  }).replace(':', ' h ');
}
function formatWeekdayDate(iso) {
  // "Samedi le 17 octobre"
  if (!iso) return '';
  const d = new Date(iso + 'T12:00:00');
  const weekday = d.toLocaleDateString('fr-CA', { weekday: 'long' });
  const rest = d.toLocaleDateString('fr-CA', { day: 'numeric', month: 'long' });
  const w = weekday.charAt(0).toUpperCase() + weekday.slice(1);
  return `${w} le ${rest}`;
}
function formatPopupWhen(g) {
  // "Samedi le 17 octobre 22 h 00"
  const d = new Date(g.startTimeUTC);
  const weekday = d.toLocaleDateString('fr-CA', { weekday: 'long' });
  const rest = d.toLocaleDateString('fr-CA', { day: 'numeric', month: 'long' });
  const time = d.toLocaleTimeString('fr-CA', { hour: '2-digit', minute: '2-digit' }).replace(':', ' h ');
  const w = weekday.charAt(0).toUpperCase() + weekday.slice(1);
  return `${w} le ${rest} ${time}`;
}
function formatStartLocal(g) {
  // compat
  return formatPopupWhen(g);
}
function teamLogo(team) {
  return team.logo || `https://assets.nhle.com/logos/nhl/svg/${team.abbrev}_light.svg`;
}
function isFinal(g) {
  return g.gameState === 'FINAL' || g.gameState === 'OFF';
}
function startMs(g) {
  return new Date(g.startTimeUTC).getTime();
}

/** Dernier match TERMINÉ joué à domicile dans chaque ville */
function lastHomeFinalPerCity(list) {
  const best = {};
  list.filter(isFinal).forEach(g => {
    const h = g.homeTeam.abbrev;
    if (!best[h] || startMs(g) > startMs(best[h])) best[h] = g;
  });
  return Object.values(best);
}

/** Prochain match À VENIR à domicile — un seul par ville */
function nextHomeFutPerCity(list) {
  const now = Date.now() - 5 * 60 * 1000;
  const best = {};
  list.filter(g => g.gameState === 'FUT' && startMs(g) >= now).forEach(g => {
    const h = g.homeTeam.abbrev;
    if (!best[h] || startMs(g) < startMs(best[h])) best[h] = g;
  });
  return Object.values(best);
}

/**
 * TOUS — logique par équipe :
 * 1) Matchs LIVE
 * 2) Matchs d'aujourd'hui (terminés ou à venir)
 * 3) Pour chaque équipe absente, ajouter son dernier match terminé
 *    (doublons possibles volontairement pour représenter l'adversaire)
 */
function gamesForTous(list) {
  const today = todayISO();
  const byId = new Map();

  const add = g => { if (g && g.id != null) byId.set(g.id, g); };

  // LIVE + tout le jour courant
  list.forEach(g => {
    if (g.gameState === 'LIVE') add(g);
    else if (g.gameDate === today) add(g);
  });

  // Équipes déjà représentées
  const covered = new Set();
  byId.forEach(g => {
    covered.add(g.awayTeam.abbrev);
    covered.add(g.homeTeam.abbrev);
  });

  // Toutes les équipes connues (aréna + données)
  const allTeams = new Set(Object.keys(arenas));
  list.forEach(g => {
    allTeams.add(g.awayTeam.abbrev);
    allTeams.add(g.homeTeam.abbrev);
  });

  // Dernier match terminé par équipe
  const lastByTeam = {};
  list.filter(isFinal).forEach(g => {
    [g.awayTeam.abbrev, g.homeTeam.abbrev].forEach(t => {
      if (!lastByTeam[t] || startMs(g) > startMs(lastByTeam[t])) lastByTeam[t] = g;
    });
  });

  allTeams.forEach(t => {
    if (covered.has(t)) return;
    const last = lastByTeam[t];
    if (!last) return;
    add(last);
    covered.add(last.awayTeam.abbrev);
    covered.add(last.homeTeam.abbrev);
  });

  return Array.from(byId.values());
}

function textFilter(list) {
  const q = (document.getElementById('filter').value || '').toUpperCase().trim();
  if (!q) return list;
  return list.filter(g => {
    const hay = [
      g.awayTeam.abbrev, g.homeTeam.abbrev,
      g.awayTeam.placeName?.default, g.homeTeam.placeName?.default,
      g.awayTeam.commonName?.default, g.homeTeam.commonName?.default
    ].filter(Boolean).join(' ').toUpperCase();
    return hay.includes(q);
  });
}

function filteredGames() {
  // Date précise choisie → matchs de ce jour, filtrés par statut simple
  if (selectedDate) {
    let list = games.filter(g => g.gameDate === selectedDate);
    if (activeStatus === 'LIVE') list = list.filter(g => g.gameState === 'LIVE');
    else if (activeStatus === 'FUT') list = list.filter(g => g.gameState === 'FUT');
    else if (activeStatus === 'FINAL') list = list.filter(isFinal);
    return textFilter(list);
  }

  // Mode "aujourd'hui / now" avec logiques intelligentes
  if (activeStatus === 'LIVE') {
    return textFilter(games.filter(g => g.gameState === 'LIVE'));
  }
  if (activeStatus === 'FUT') {
    return textFilter(nextHomeFutPerCity(games));
  }
  if (activeStatus === 'FINAL') {
    return textFilter(lastHomeFinalPerCity(games));
  }
  // ALL
  return textFilter(gamesForTous(games));
}

function labelHtml(g) {
  const al = teamLogo(g.awayTeam);
  const hl = teamLogo(g.homeTeam);
  return `
    <div class="game-label ${labelClass(g.gameState)}">
      <div class="logos">
        <img src="${al}" alt="${g.awayTeam.abbrev}" onerror="this.style.display='none'">
        <span class="at">@</span>
        <img src="${hl}" alt="${g.homeTeam.abbrev}" onerror="this.style.display='none'">
      </div>
      <div class="sc">${g.awayTeam.score ?? 0} – ${g.homeTeam.score ?? 0}</div>
      <div class="tm">${clockText(g)}</div>
      <div class="dt">${formatDateShort(g.gameDate)}</div>
    </div>`;
}

function clearMarkers() {
  markers.forEach(m => map.removeLayer(m));
  markers = [];
}

function placeMarkers(list) {
  clearMarkers();
  const byArena = {};
  list.forEach(g => {
    const h = g.homeTeam.abbrev;
    if (!arenas[h]) return;
    (byArena[h] ||= []).push(g);
  });
  Object.entries(byArena).forEach(([abbrev, gs]) => {
    const base = arenas[abbrev];
    gs.forEach((g, i) => {
      const lat = base[0] + i * 0.28;
      const lng = base[1] + i * 0.05;
      const icon = L.divIcon({
        className: '',
        html: labelHtml(g),
        iconSize: null,
        iconAnchor: [55, 28]
      });
      const m = L.marker([lat, lng], {
        icon,
        zIndexOffset: g.gameState === 'LIVE' ? 1000 : (g.gameState === 'FUT' ? 500 : 0)
      }).addTo(map);
      m._gameId = g.id;
      m.bindPopup(`
        <div style="min-width:150px">
          <div style="display:flex;align-items:center;gap:6px;justify-content:center;margin-bottom:4px">
            <img src="${teamLogo(g.awayTeam)}" width="28" height="28" style="object-fit:contain;background:#fff;border-radius:4px;padding:1px" onerror="this.style.display='none'">
            <b>${g.awayTeam.abbrev}</b>
            <span style="opacity:.6">@</span>
            <img src="${teamLogo(g.homeTeam)}" width="28" height="28" style="object-fit:contain;background:#fff;border-radius:4px;padding:1px" onerror="this.style.display='none'">
            <b>${g.homeTeam.abbrev}</b>
          </div>
          <div style="font-size:22px;font-weight:bold;text-align:center">${g.awayTeam.score ?? 0} – ${g.homeTeam.score ?? 0}</div>
          <div style="text-align:center">${clockText(g)}</div>
          <div style="font-size:12px;margin-top:6px;text-align:center">${formatPopupWhen(g)}</div>
          <div style="font-size:11px;color:#555;text-align:center;margin-top:2px">${g.venue?.default || ''}</div>
        </div>
      `, { autoClose: true, closeOnClick: true, closeOnEscapeKey: true });
      markers.push(m);
    });
  });
}

function draw() {
  const list = filteredGames();
  const el = document.getElementById('games');
  if (!list.length) {
    el.innerHTML = `<div class="game"><b>Aucun match</b><div class="meta">Ajuste la date ou les filtres</div></div>`;
    return;
  }
  const order = { LIVE: 0, FUT: 1, FINAL: 2, OFF: 2 };
  list.sort((a, b) => {
    const oa = order[a.gameState] ?? 3;
    const ob = order[b.gameState] ?? 3;
    if (oa !== ob) return oa - ob;
    return startMs(a) - startMs(b);
  });
  el.innerHTML = list.map(g => {
    const cls = statusClass(g.gameState);
    const border = borderClass(g.gameState);
    return `
      <div class="game ${border}" data-id="${g.id}">
        <div class="teams-row ${cls}">
          <img class="logo" src="${teamLogo(g.awayTeam)}" alt="${g.awayTeam.abbrev}" loading="lazy" onerror="this.style.display='none'">
          <b>${g.awayTeam.abbrev}</b>
          <span class="vs">@</span>
          <img class="logo" src="${teamLogo(g.homeTeam)}" alt="${g.homeTeam.abbrev}" loading="lazy" onerror="this.style.display='none'">
          <b>${g.homeTeam.abbrev}</b>
        </div>
        <div class="score">${g.awayTeam.score ?? 0} – ${g.homeTeam.score ?? 0}</div>
        <div class="meta">
          <strong>${clockText(g)}</strong><br>
          📅 ${formatDateOnly(g.gameDate)}<br>
          🕐 ${formatTimeOnly(g)}<br>
          📍 ${g.venue?.default || '—'}
        </div>
      </div>`;
  }).join('');

  el.querySelectorAll('.game').forEach(card => {
    card.addEventListener('click', () => {
      const g = games.find(x => String(x.id) === card.dataset.id);
      if (!g) return;
      const coords = arenas[g.homeTeam.abbrev];
      if (coords) {
        map.setView(coords, 8);
        const m = markers.find(mk => mk._gameId === g.id);
        if (m) m.openPopup();
      }
      closeMenu();
    });
  });
}

function mergeGamesById(lists) {
  const map = new Map();
  lists.flat().forEach(g => {
    if (g && g.id != null) map.set(g.id, g);
  });
  return Array.from(map.values());
}

function extractGames(data) {
  const out = [];
  (data.gamesByDate || []).forEach(d => (d.games || []).forEach(g => out.push(g)));
  return out;
}

function applyData(list) {
  games = list;
  placeMarkers(filteredGames());
  draw();
  setTimeout(() => map.invalidateSize(), 120);
}

async function fetchJson(path) {
  for (const url of proxyUrlsFor(path)) {
    try {
      const ctrl = new AbortController();
      const t = setTimeout(() => ctrl.abort(), 7000);
      const r = await fetch(url, { signal: ctrl.signal, cache: 'no-store' });
      clearTimeout(t);
      if (!r.ok) continue;
      const data = await r.json();
      if (data) return data;
    } catch (_) {}
  }
  return null;
}

async function fetchLocal() {
  const r = await fetch('scoreboard_now.json', { cache: 'no-store' });
  if (!r.ok) throw new Error('Données indisponibles');
  return r.json();
}

/** Charge now + quelques jours passés pour "dernier match par ville/équipe" */
async function load() {
  try {
    if (selectedDate) {
      let data = await fetchJson(`scoreboard/${selectedDate}`);
      if (!data) data = await fetchLocal();
      let list = extractGames(data);
      if (selectedDate) list = list.filter(g => g.gameDate === selectedDate || !g.gameDate);
      applyData(list);
      return;
    }

    // Mode now : scoreboard/now + 10 jours en arrière pour historique
    const today = todayISO();
    const paths = ['scoreboard/now'];
    for (let i = 1; i <= 10; i++) {
      paths.push(`scoreboard/${shiftDate(today, -i)}`);
    }

    const results = await Promise.all(paths.map(p => fetchJson(p)));
    const chunks = results.filter(Boolean).map(extractGames);
    let list = mergeGamesById(chunks);

    if (!list.length) {
      const local = await fetchLocal();
      list = extractGames(local);
    }
    applyData(list);
  } catch (e) {
    document.getElementById('games').innerHTML =
      `<div class="game"><b>Erreur</b><div class="meta">${e.message}</div></div>`;
  }
}


function displayedDateISO() {
  return selectedDate || todayISO();
}
function updateDateLabel() {
  const el = document.getElementById('dateLabel');
  if (!el) return;
  el.textContent = formatWeekdayDate(displayedDateISO());
}

const sidebar = document.getElementById('sidebar');
const backdrop = document.getElementById('backdrop');
function openMenu() {
  sidebar.classList.add('open');
  backdrop.classList.add('show');
}
function closeMenu() {
  sidebar.classList.remove('open');
  backdrop.classList.remove('show');
}
document.getElementById('menuToggle').addEventListener('click', () => {
  if (sidebar.classList.contains('open')) closeMenu();
  else openMenu();
});
backdrop.addEventListener('click', closeMenu);

document.getElementById('statusFilters').addEventListener('click', e => {
  const chip = e.target.closest('.chip');
  if (!chip) return;
  document.querySelectorAll('#statusFilters .chip').forEach(c => c.classList.remove('active'));
  chip.classList.add('active');
  activeStatus = chip.dataset.status;
  placeMarkers(filteredGames());
  draw();
});
document.getElementById('filter').addEventListener('input', () => {
  placeMarkers(filteredGames());
  draw();
});

document.getElementById('datePick').addEventListener('change', e => {
  if (!e.target.value) return;
  selectedDate = e.target.value;
  updateDateLabel();
  load();
});
document.getElementById('prevDay').addEventListener('click', () => {
  selectedDate = shiftDate(selectedDate || todayISO(), -1);
  document.getElementById('datePick').value = selectedDate;
  updateDateLabel();
  load();
});
document.getElementById('nextDay').addEventListener('click', () => {
  selectedDate = shiftDate(selectedDate || todayISO(), 1);
  document.getElementById('datePick').value = selectedDate;
  updateDateLabel();
  load();
});
document.getElementById('todayBtn').addEventListener('click', () => {
  selectedDate = null;
  document.getElementById('datePick').value = todayISO();
  updateDateLabel();
  load();
});

document.getElementById('datePick').value = todayISO();
selectedDate = null;
updateDateLabel();
load();
setInterval(load, 45000);
window.addEventListener('resize', () => setTimeout(() => map.invalidateSize(), 200));
</script>
