<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NHL247 FlightMap V6</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{
  --bg:#070d18;
  --panel:#0b1220;
  --card:#152033;
  --card-hover:#1c2a42;
  --border:#243247;
  --text:#f1f5f9;
  --muted:#94a3b8;
  --accent:#e31837;
  --live:#22c55e;
  --fut:#3b82f6;
  --final:#94a3b8;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;font-family:Segoe UI,system-ui,-apple-system,Arial,sans-serif;background:var(--bg);color:var(--text)}
body{display:flex;flex-direction:column}

/* Header */
.hdr{
  flex:0 0 auto;
  display:flex;align-items:center;gap:12px;
  padding:10px 14px;
  background:linear-gradient(180deg,#111827 0%,#0b1220 100%);
  border-bottom:1px solid var(--border);
  z-index:1100;
}
.hdr-logo{
  width:40px;height:40px;object-fit:contain;
  filter:drop-shadow(0 1px 2px rgba(0,0,0,.4));
}
.hdr-text{flex:1;min-width:0}
.hdr-text h1{
  margin:0;font-size:1.05rem;font-weight:700;letter-spacing:.02em;
  display:flex;align-items:center;gap:6px;
}
.hdr-text h1 span.nhl{color:var(--accent)}
.hdr-text .sub{font-size:11px;color:var(--muted);margin-top:1px}
.live-dot{
  width:8px;height:8px;border-radius:50%;background:var(--live);
  box-shadow:0 0 0 0 rgba(34,197,94,.7);
  animation:pulse 1.6s infinite;display:inline-block;
}
@keyframes pulse{
  0%{box-shadow:0 0 0 0 rgba(34,197,94,.55)}
  70%{box-shadow:0 0 0 8px rgba(34,197,94,0)}
  100%{box-shadow:0 0 0 0 rgba(34,197,94,0)}
}

/* Layout */
.main{flex:1;min-height:0;display:flex;position:relative}

#sidebar{
  width:400px;max-width:100%;
  background:var(--panel);
  overflow:auto;
  border-right:1px solid var(--border);
  display:flex;flex-direction:column;
}
#map{flex:1;min-width:0;min-height:0}

.controls{padding:8px 10px 6px;border-bottom:1px solid var(--border);background:#0a101c}
.date-nav{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.date-nav input[type=date]{
  flex:1;padding:8px 10px;border-radius:8px;border:1px solid var(--border);
  background:#121a2b;color:var(--text);font-size:14px
}
.icon-btn{
  width:38px;height:38px;border:1px solid var(--border);border-radius:8px;
  background:#121a2b;color:var(--text);font-size:14px;cursor:pointer
}
.icon-btn:active{background:#1c2a42}
.today-btn{
  height:38px;padding:0 10px;border:1px solid var(--border);border-radius:8px;
  background:#121a2b;color:var(--text);font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap
}
#filter{
  width:100%;padding:9px 12px;border-radius:8px;border:1px solid var(--border);
  background:#121a2b;color:var(--text);font-size:14px;margin-bottom:6px
}
.filters{display:flex;flex-wrap:wrap;gap:6px}
.chip{
  padding:6px 11px;border-radius:999px;border:1px solid var(--border);
  background:#121a2b;color:#cbd5e1;font-size:12px;cursor:pointer;user-select:none
}
.chip.active{background:#1d4ed8;border-color:#1d4ed8;color:#fff}
.chip.live.active{background:#15803d;border-color:#15803d}
.chip.final.active{background:#475569;border-color:#475569}

#games{flex:1;overflow:auto;padding:6px 0 16px;-webkit-overflow-scrolling:touch}

.game{
  background:var(--card);margin:6px 8px;padding:12px;
  border-radius:12px;cursor:pointer;transition:background .15s;
  border-left:4px solid #475569
}
.game:active{background:var(--card-hover)}
.game.live-border{border-left-color:var(--live)}
.game.fut-border{border-left-color:var(--fut)}
.game.final-border{border-left-color:var(--final)}
.teams-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.teams-row img.logo{
  width:30px;height:30px;object-fit:contain;
  background:rgba(255,255,255,.06);border-radius:6px;padding:2px
}
.vs{font-size:12px;color:#64748b;font-weight:600}
.score{font-size:26px;font-weight:800;margin:8px 0 4px;letter-spacing:.02em}
.meta{font-size:12px;color:var(--muted);line-height:1.5}
.meta strong{color:#e2e8f0}
.live{color:var(--live)}
.future{color:#60a5fa}
.final{color:var(--final)}

/* Map labels */
.game-label{
  color:#fff;font-weight:700;font-size:12px;line-height:1.2;
  padding:4px 7px;border-radius:8px;text-align:center;
  white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,.5);
  pointer-events:none;border:2px solid transparent
}
.label-live{background:rgba(22,163,74,.94);border-color:#4ade80}
.label-fut{background:rgba(37,99,235,.92);border-color:#60a5fa}
.label-final{background:rgba(15,23,42,.94);border-color:#94a3b8}
.game-label .teams{font-size:11px;opacity:.95}
.game-label .sc{font-size:14px;margin-top:1px}
.game-label .tm{font-size:10px;font-weight:600;margin-top:2px;opacity:.9}

/* Mobile drawer */
.menu-toggle{
  display:none;border:1px solid var(--border);background:#121a2b;color:#fff;
  border-radius:8px;width:40px;height:40px;font-size:18px;cursor:pointer;flex-shrink:0
}
.backdrop{
  display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:1050
}
.backdrop.show{display:block}

/* Mobile layout */
@media (max-width:900px){
  .menu-toggle{display:inline-flex;align-items:center;justify-content:center}
  .main{flex-direction:column}
  #sidebar{
    position:fixed;left:0;top:0;bottom:0;width:min(360px,88vw);
    z-index:1100;transform:translateX(-105%);
    transition:transform .22s ease;box-shadow:8px 0 24px rgba(0,0,0,.4);
    border-right:1px solid var(--border)
  }
  #sidebar.open{transform:translateX(0)}
  #map{width:100%;height:100%}
  .hdr{padding:10px 12px}
  .hdr-text h1{font-size:1rem}
}
</style>
</head>
<body>
<header class="hdr">
  <button class="menu-toggle" id="menuToggle" aria-label="Menu">☰</button>
  <img class="hdr-logo"
       src="https://assets.nhle.com/logos/nhl/svg/NHL_light.svg"
       alt="NHL"
       onerror="this.src='https://upload.wikimedia.org/wikipedia/en/3/3a/05_NHL_Shield.svg'">
  <div class="hdr-text">
    <h1><span class="nhl">NHL</span>247 FlightMap <span class="live-dot" title="Mise à jour auto"></span></h1>
    <div class="sub">Scores · carte · historique</div>
  </div>
</header>

<div class="backdrop" id="backdrop"></div>

<div class="main">
  <aside id="sidebar">
    <div class="controls">
      <div class="date-nav">
        <button class="icon-btn" id="prevDay" title="Jour précédent">◀</button>
        <input type="date" id="datePick">
        <button class="icon-btn" id="nextDay" title="Jour suivant">▶</button>
        <button class="today-btn" id="todayBtn">Auj.</button>
      </div>
      <input type="text" id="filter" placeholder="Filtrer équipe (MTL, TOR...)">
      <div class="filters" id="statusFilters">
        <span class="chip active" data-status="ALL">Tous</span>
        <span class="chip live" data-status="LIVE">Live</span>
        <span class="chip fut" data-status="FUT">À venir</span>
        <span class="chip final" data-status="FINAL">Terminés</span>
      </div>
    </div>
    <div id="games">Chargement...</div>
  </aside>
  <div id="map"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const arenas = {
  MTL:[45.496,-73.5693], TOR:[43.6435,-79.3791], OTT:[45.2969,-75.9272],
  EDM:[53.5461,-113.497], CGY:[51.0374,-114.05], VAN:[49.2775,-123.108],
  WPG:[49.8926,-97.1439], SEA:[47.622,-122.354], LAK:[34.043,-118.2673],
  ANA:[33.8078,-117.8767], VGK:[36.1028,-115.178], COL:[39.7487,-105.0077],
  DAL:[32.7905,-96.8103], CHI:[41.8807,-87.6742], MIN:[44.9448,-93.101],
  STL:[38.6268,-90.2026], NSH:[36.1591,-86.7785], DET:[42.3411,-83.055],
  CBJ:[39.969,-83.0063], PIT:[40.439,-79.9894], BUF:[42.875,-78.8766],
  BOS:[42.3662,-71.0621], NYR:[40.7505,-73.9934], NYI:[40.7229,-73.5905],
  NJD:[40.7336,-74.171], PHI:[39.9012,-75.1719], WSH:[38.8981,-77.0209],
  CAR:[35.8033,-78.7218], TBL:[27.9427,-82.4518], FLA:[26.1585,-80.3256],
  SJS:[37.3328,-121.9011]
};

const map = L.map('map', { zoomControl: true }).setView([45, -97], 4);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '© OpenStreetMap',
  maxZoom: 18
}).addTo(map);

let games = [];
let markers = [];
let activeStatus = 'ALL';
let selectedDate = null;
let refreshTimer = null;

function todayISO() {
  return new Date().toISOString().slice(0, 10);
}
function shiftDate(iso, days) {
  const d = new Date(iso + 'T12:00:00');
  d.setDate(d.getDate() + days);
  return d.toISOString().slice(0, 10);
}
function proxyUrlsFor(dateIso) {
  const path = dateIso ? `scoreboard/${dateIso}` : 'scoreboard/now';
  const target = `https://api-web.nhle.com/v1/${path}`;
  return [
    `https://corsproxy.io/?${target}`,
    `https://cors.isomorphic-git.org/${target}`,
    target
  ];
}
function periodText(g) {
  const pd = g.periodDescriptor;
  if (!pd) return '';
  if (pd.periodType === 'OT') return pd.number > 4 ? `Prol. ${pd.number - 3}` : 'Prolongation';
  if (pd.periodType === 'SO') return 'Tirs de barrage';
  return `${pd.number}e période`;
}
function clockText(g) {
  if (g.gameState === 'LIVE') {
    const clock = g.clock?.timeRemaining;
    const per = periodText(g);
    return clock ? `${per} · ${clock}` : (per || 'LIVE');
  }
  if (g.gameState === 'FUT') {
    return new Date(g.startTimeUTC).toLocaleTimeString('fr-CA', { hour: '2-digit', minute: '2-digit' });
  }
  if (g.gameState === 'FINAL' || g.gameState === 'OFF') {
    const per = periodText(g);
    return (per && per !== '3e période') ? `FINAL (${per})` : 'FINAL';
  }
  return g.gameState || '';
}
function statusClass(state) {
  if (state === 'LIVE') return 'live';
  if (state === 'FUT') return 'future';
  return 'final';
}
function borderClass(state) {
  if (state === 'LIVE') return 'live-border';
  if (state === 'FUT') return 'fut-border';
  return 'final-border';
}
function labelClass(state) {
  if (state === 'LIVE') return 'label-live';
  if (state === 'FUT') return 'label-fut';
  return 'label-final';
}
function formatDateFR(iso) {
  if (!iso) return '';
  return new Date(iso + 'T12:00:00').toLocaleDateString('fr-CA', {
    weekday: 'short', year: 'numeric', month: 'short', day: 'numeric'
  });
}
function formatStartLocal(g) {
  return new Date(g.startTimeUTC).toLocaleString('fr-CA', {
    weekday: 'short', day: 'numeric', month: 'short',
    hour: '2-digit', minute: '2-digit'
  });
}
function matchesStatus(g) {
  if (activeStatus === 'ALL') return true;
  if (activeStatus === 'LIVE') return g.gameState === 'LIVE';
  if (activeStatus === 'FUT') return g.gameState === 'FUT';
  if (activeStatus === 'FINAL') return g.gameState === 'FINAL' || g.gameState === 'OFF';
  return true;
}
function filteredGames() {
  const q = (document.getElementById('filter').value || '').toUpperCase().trim();
  return games.filter(g => {
    if (!matchesStatus(g)) return false;
    if (!q) return true;
    const hay = [
      g.awayTeam.abbrev, g.homeTeam.abbrev,
      g.awayTeam.placeName?.default, g.homeTeam.placeName?.default,
      g.awayTeam.commonName?.default, g.homeTeam.commonName?.default
    ].filter(Boolean).join(' ').toUpperCase();
    return hay.includes(q);
  });
}
function labelHtml(g) {
  return `
    <div class="game-label ${labelClass(g.gameState)}">
      <div class="teams">${g.awayTeam.abbrev} @ ${g.homeTeam.abbrev}</div>
      <div class="sc">${g.awayTeam.score ?? 0} – ${g.homeTeam.score ?? 0}</div>
      <div class="tm">${clockText(g)}</div>
    </div>`;
}
function clearMarkers() {
  markers.forEach(m => map.removeLayer(m));
  markers = [];
}
function placeMarkers(list) {
  clearMarkers();
  const byArena = {};
  list.forEach(g => {
    const h = g.homeTeam.abbrev;
    if (!arenas[h]) return;
    (byArena[h] ||= []).push(g);
  });
  Object.entries(byArena).forEach(([abbrev, gs]) => {
    const base = arenas[abbrev];
    gs.forEach((g, i) => {
      const lat = base[0] + i * 0.12;
      const lng = base[1] + i * 0.08;
      const icon = L.divIcon({ className: '', html: labelHtml(g), iconSize: null, iconAnchor: [50, 20] });
      const m = L.marker([lat, lng], { icon, zIndexOffset: g.gameState === 'LIVE' ? 1000 : 0 }).addTo(map);
      m._gameId = g.id;
      m.bindPopup(`
        <b>${g.awayTeam.abbrev} @ ${g.homeTeam.abbrev}</b><br>
        <div style="font-size:22px;font-weight:bold">${g.awayTeam.score ?? 0} – ${g.homeTeam.score ?? 0}</div>
        <div>${clockText(g)}</div>
        <div style="font-size:12px;margin-top:4px">${formatStartLocal(g)}</div>
        <div style="font-size:11px;color:#555">${g.venue?.default || ''}</div>
      `);
      markers.push(m);
    });
  });
}
function draw() {
  const list = filteredGames();
  const el = document.getElementById('games');
  if (!list.length) {
    el.innerHTML = `<div class="game"><b>Aucun match</b><div class="meta">Ajuste la date ou les filtres</div></div>`;
    return;
  }
  const order = { LIVE: 0, FUT: 1, FINAL: 2, OFF: 2 };
  list.sort((a, b) => {
    const oa = order[a.gameState] ?? 3;
    const ob = order[b.gameState] ?? 3;
    if (oa !== ob) return oa - ob;
    return new Date(a.startTimeUTC) - new Date(b.startTimeUTC);
  });
  el.innerHTML = list.map(g => {
    const cls = statusClass(g.gameState);
    const border = borderClass(g.gameState);
    const awayLogo = g.awayTeam.logo || `https://assets.nhle.com/logos/nhl/svg/${g.awayTeam.abbrev}_light.svg`;
    const homeLogo = g.homeTeam.logo || `https://assets.nhle.com/logos/nhl/svg/${g.homeTeam.abbrev}_light.svg`;
    return `
      <div class="game ${border}" data-id="${g.id}">
        <div class="teams-row ${cls}">
          <img class="logo" src="${awayLogo}" alt="${g.awayTeam.abbrev}" loading="lazy" onerror="this.style.display='none'">
          <b>${g.awayTeam.abbrev}</b>
          <span class="vs">@</span>
          <img class="logo" src="${homeLogo}" alt="${g.homeTeam.abbrev}" loading="lazy" onerror="this.style.display='none'">
          <b>${g.homeTeam.abbrev}</b>
        </div>
        <div class="score">${g.awayTeam.score ?? 0} – ${g.homeTeam.score ?? 0}</div>
        <div class="meta">
          <strong>${clockText(g)}</strong><br>
          📅 ${formatDateFR(g.gameDate)}<br>
          🕐 ${formatStartLocal(g)}<br>
          📍 ${g.venue?.default || '—'}
        </div>
      </div>`;
  }).join('');

  el.querySelectorAll('.game').forEach(card => {
    card.addEventListener('click', () => {
      const g = games.find(x => String(x.id) === card.dataset.id);
      if (!g) return;
      const coords = arenas[g.homeTeam.abbrev];
      if (coords) {
        map.setView(coords, 8);
        const m = markers.find(mk => mk._gameId === g.id);
        if (m) m.openPopup();
      }
      // close drawer on mobile after selection
      closeMenu();
    });
  });
}
function applyData(data) {
  games = [];
  (data.gamesByDate || []).forEach(d => {
    (d.games || []).forEach(g => {
      if (selectedDate && g.gameDate && g.gameDate !== selectedDate) return;
      games.push(g);
    });
  });
  if (selectedDate && games.length === 0) {
    (data.gamesByDate || []).forEach(d => {
      if (d.date === selectedDate) (d.games || []).forEach(g => games.push(g));
    });
  }
  placeMarkers(filteredGames());
  draw();
  setTimeout(() => map.invalidateSize(), 120);
}
async function fetchLive(dateIso) {
  for (const url of proxyUrlsFor(dateIso)) {
    try {
      const ctrl = new AbortController();
      const t = setTimeout(() => ctrl.abort(), 7000);
      const r = await fetch(url, { signal: ctrl.signal, cache: 'no-store' });
      clearTimeout(t);
      if (!r.ok) continue;
      const data = await r.json();
      if (data && data.gamesByDate) return data;
    } catch (_) {}
  }
  return null;
}
async function fetchLocal() {
  const r = await fetch('scoreboard_now.json', { cache: 'no-store' });
  if (!r.ok) throw new Error('Données indisponibles');
  return r.json();
}
async function load() {
  try {
    let data = await fetchLive(selectedDate);
    if (!data) data = await fetchLocal();
    applyData(data);
  } catch (e) {
    document.getElementById('games').innerHTML =
      `<div class="game"><b>Erreur</b><div class="meta">${e.message}</div></div>`;
  }
}

/* Mobile menu */
const sidebar = document.getElementById('sidebar');
const backdrop = document.getElementById('backdrop');
function openMenu() {
  sidebar.classList.add('open');
  backdrop.classList.add('show');
}
function closeMenu() {
  sidebar.classList.remove('open');
  backdrop.classList.remove('show');
}
document.getElementById('menuToggle').addEventListener('click', () => {
  if (sidebar.classList.contains('open')) closeMenu();
  else openMenu();
});
backdrop.addEventListener('click', closeMenu);

/* Filters */
document.getElementById('statusFilters').addEventListener('click', e => {
  const chip = e.target.closest('.chip');
  if (!chip) return;
  document.querySelectorAll('#statusFilters .chip').forEach(c => c.classList.remove('active'));
  chip.classList.add('active');
  activeStatus = chip.dataset.status;
  placeMarkers(filteredGames());
  draw();
});
document.getElementById('filter').addEventListener('input', () => {
  placeMarkers(filteredGames());
  draw();
});

/* Date nav */
document.getElementById('datePick').addEventListener('change', e => {
  if (!e.target.value) return;
  selectedDate = e.target.value;
  load();
});
document.getElementById('prevDay').addEventListener('click', () => {
  selectedDate = shiftDate(selectedDate || todayISO(), -1);
  document.getElementById('datePick').value = selectedDate;
  load();
});
document.getElementById('nextDay').addEventListener('click', () => {
  selectedDate = shiftDate(selectedDate || todayISO(), 1);
  document.getElementById('datePick').value = selectedDate;
  load();
});
document.getElementById('todayBtn').addEventListener('click', () => {
  selectedDate = null;
  document.getElementById('datePick').value = todayISO();
  load();
});

document.getElementById('datePick').value = todayISO();
selectedDate = null;
load();
// Auto refresh live every 30s
refreshTimer = setInterval(load, 30000);

// Fix map size on orientation change
window.addEventListener('resize', () => setTimeout(() => map.invalidateSize(), 200));
</script>
</body>
</html>
