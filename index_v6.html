<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NHL247 FlightMap V6</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
html,body{height:100%;margin:0;font-family:Segoe UI,Arial;background:#08111f;color:#fff}
#sidebar{position:absolute;left:0;top:0;bottom:0;width:380px;background:#0f172a;overflow:auto;z-index:1000}
#map{position:absolute;left:380px;right:0;top:0;bottom:0}
.hdr{padding:15px;background:#111827;border-bottom:1px solid #334155}
.game{background:#1e293b;margin:8px;padding:10px;border-radius:10px}
.score{font-size:26px;font-weight:bold}
#status{position:absolute;top:10px;right:10px;background:#fff;color:#000;padding:8px;border-radius:8px;z-index:2000}
input{margin:10px;width:calc(100% - 20px);padding:10px}
.live{color:#4ade80}
.future{color:#60a5fa}
.final{color:#d1d5db}
.btn{margin:8px 10px;padding:8px 12px;background:#2563eb;color:#fff;border:none;border-radius:6px;cursor:pointer}
.btn:hover{background:#1d4ed8}
.note{font-size:12px;color:#94a3b8;padding:0 12px 8px}
@media(max-width:900px){#sidebar{width:100%;height:40%}#map{left:0;top:40%}}
</style>
</head>
<body>
<div id='sidebar'>
  <div class='hdr'>
    <h2>🏒 NHL247 FlightMap V6</h2>
    <div>Version JSON local (hors ligne / anti-blocage)</div>
  </div>
  <input id='filter' placeholder='Filtrer équipe...'>
  <button class='btn' id='reloadBtn'>Recharger JSON local</button>
  <div class='note'>Charge <code>scoreboard_now.json</code> (même dossier). Pour mettre à jour : télécharge le JSON depuis un environnement non bloqué.</div>
  <div id='games'>Chargement...</div>
</div>
<div id='status'>Init...</div>
<div id='map'></div>

<script src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js'></script>
<script>
const arenas = {
  MTL:[45.496,-73.5693], TOR:[43.6435,-79.3791], OTT:[45.2969,-75.9272],
  EDM:[53.5461,-113.497], CGY:[51.0374,-114.05], VAN:[49.2775,-123.108],
  WPG:[49.8926,-97.1439], SEA:[47.622,-122.354], LAK:[34.043,-118.2673],
  ANA:[33.8078,-117.8767], VGK:[36.1028,-115.178], COL:[39.7487,-105.0077],
  DAL:[32.7905,-96.8103], CHI:[41.8807,-87.6742], MIN:[44.9448,-93.101],
  STL:[38.6268,-90.2026], NSH:[36.1591,-86.7785], DET:[42.3411,-83.055],
  CBJ:[39.969,-83.0063], PIT:[40.439,-79.9894], BUF:[42.875,-78.8766],
  BOS:[42.3662,-71.0621], NYR:[40.7505,-73.9934], NYI:[40.7229,-73.5905],
  NJD:[40.7336,-74.171], PHI:[39.9012,-75.1719], WSH:[38.8981,-77.0209],
  CAR:[35.8033,-78.7218], TBL:[27.9427,-82.4518], FLA:[26.1585,-80.3256],
  SJS:[37.3328,-121.9011]
};

const map = L.map('map').setView([45,-97], 4);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

let games = [];
let markers = [];

function clearM() {
  markers.forEach(m => map.removeLayer(m));
  markers = [];
}

function st(g) {
  if (g.gameState === 'LIVE') return `${g.periodDescriptor?.number || ''}e période ${g.clock?.timeRemaining || ''}`;
  if (g.gameState === 'FUT') return new Date(g.startTimeUTC).toLocaleTimeString('fr-CA', { hour: '2-digit', minute: '2-digit' });
  if (g.gameState === 'FINAL' || g.gameState === 'OFF') return 'FINAL';
  return g.gameState || '';
}

function draw() {
  const q = (document.getElementById('filter').value || '').toUpperCase();
  document.getElementById('games').innerHTML = games
    .filter(g => `${g.awayTeam.abbrev} ${g.homeTeam.abbrev}`.includes(q))
    .map(g => {
      const c = g.gameState === 'LIVE' ? 'live' : (g.gameState === 'FUT' ? 'future' : 'final');
      return `<div class='game'>
        <div class='${c}'><b>${g.awayTeam.abbrev} @ ${g.homeTeam.abbrev}</b></div>
        <div class='score'>${g.awayTeam.score || 0}-${g.homeTeam.score || 0}</div>
        <div>${st(g)}</div>
      </div>`;
    }).join('') || 'Aucun match';
}

async function loadLocal() {
  try {
    document.getElementById('status').innerText = 'Chargement JSON local...';
    const r = await fetch('scoreboard_now.json', { cache: 'no-store' });
    if (!r.ok) throw new Error(`HTTP ${r.status} — place scoreboard_now.json à côté de index_v6.html`);
    const data = await r.json();

    games = [];
    (data.gamesByDate || []).forEach(d => (d.games || []).forEach(g => games.push(g)));

    clearM();
    games.forEach(g => {
      const h = g.homeTeam.abbrev;
      if (!arenas[h]) return;
      const m = L.marker(arenas[h]).addTo(map);
      m.bindPopup(`
        <b>${g.awayTeam.abbrev} @ ${g.homeTeam.abbrev}</b><br>
        <div style="font-size:24px">${g.awayTeam.score || 0}-${g.homeTeam.score || 0}</div>
        <div>${st(g)}</div>
      `);
      markers.push(m);
    });

    draw();
    document.getElementById('status').innerText = `OK (local) — ${games.length} matchs`;
  } catch (e) {
    document.getElementById('games').innerHTML = `
      <div class='game'>
        <b>Erreur</b><br>${e.message}<br><br>
        Assure-toi que <code>scoreboard_now.json</code> est dans le même dossier que cette page.
      </div>`;
    document.getElementById('status').innerText = 'Erreur';
  }
}

document.getElementById('filter').addEventListener('input', draw);
document.getElementById('reloadBtn').addEventListener('click', loadLocal);

loadLocal();
</script>
</body>
</html>
